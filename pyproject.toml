[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parselbox"
version = "0.1.2"
description = "An embeddable Python runtime where AI agents call tools as code — MCP servers, APIs and shells as native Python objects."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT License" }
authors = [
  { name = "Sanjeet Chatterjee" }
]
keywords = ["sandbox", "agents", "mcp", "code-execution", "pyodide", "deno"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]

dependencies = [
    "fastmcp>=3.1.1,<4",
    "click>=8.1",
    "cryptography>=43",
    "httpx>=0.28.1,<1",
    "keyring>=25.6",
    "mcp>=1.26,<2",
    "py-key-value-aio[filetree,keyring]>=0.4.4,<0.5",
    "rich>=13.9.4",
]

[project.urls]
Homepage = "https://github.com/thesanjeetc/Parselbox"
Repository = "https://github.com/thesanjeetc/Parselbox"
Issues = "https://github.com/thesanjeetc/Parselbox/issues"

[dependency-groups]
dev = [
    "coverage>=7.13.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::pytest.PytestWarning"]

[tool.coverage.run]
omit = [
    "parselbox/mcp.py",
    "tests/*"
]

[tool.coverage.paths]
source = ["parselbox", "*/parselbox"]

[project.scripts]
parselbox = "parselbox.cli:cli"

[tool.hatch.build.targets.wheel]
only-include = ["parselbox"]

[tool.hatch.build.targets.sdist]
only-include = ["parselbox", "pyproject.toml", "README.md", "LICENSE.md"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "F401",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["parselbox"]
